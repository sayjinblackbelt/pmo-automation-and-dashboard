name: Build and Deploy PMO Dashboard

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "automation/**"
      - ".github/workflows/pages.yml"
      - "README.md"
      - "README.en.md"
      - "README.es.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r automation/requirements.txt

      - name: Run complete automation pipeline
        run: python automation/run_project.py

      - name: Verify portfolio documentation
        run: |
          test -s README.md
          test -s README.en.md
          test -s README.es.md
          grep -q "Filipe G Morais" README.md
          grep -q "Filipe G Morais" README.en.md
          grep -q "Filipe G Morais" README.es.md
          grep -q "github.com/sayjinblackbelt" README.md
          grep -q "github.com/sayjinblackbelt" README.en.md
          grep -q "github.com/sayjinblackbelt" README.es.md

      - name: Build Pages package
        run: |
          rm -rf _site
          mkdir -p _site
          cp -r web/. _site/
          mkdir -p _site/automation/output
          cp automation/output/*.png _site/automation/output/
          cp automation/output/document_analysis_report.json _site/automation/output/
          cp automation/output/project_trend_report.json _site/automation/output/
          mkdir -p _site/automation/sample_data
          cp automation/sample_data/*.csv _site/automation/sample_data/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
